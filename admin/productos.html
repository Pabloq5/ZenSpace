<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenSpace</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<div class="dashboard">

    <aside class="barra_lateral">

        <div class="logo">
            <h1>ZenSpace</h1>
        </div>

            <nav class="menu">

            <a href="./dashboard.html" >
                <i class="bi bi-house-door"></i>
                <span>Inicio</span>
            </a>

            <a href="./productos.html" class="active">
                <i class="bi bi-box-seam"></i>
                <span>Catálogo</span>
            </a>

            <a href="./pedidos.html">
                <i class="bi bi-cart3"></i>
                <span>Pedidos</span>
            </a>
        </nav>
    </aside>

<main class="acciones_contenido">

    <header class="barra_superior">

        <div class="busqueda_general">
            <i class="bi bi-search"></i>
            <input 
            type="text"
            placeholder="Buscar pedidos, clientes, productos...">
        </div>

        <div class="opciones_usaurio">

            <div class="notificaciones">
                <i class="bi bi-bell"></i>
            </div>

            <div class="usuario">
                <i class="bi bi-person-circle"></i>
                <span>Usuario Zen</span>
                <i class="bi bi-chevron-down arrow"></i>
            </div>

        </div>

    </header>

    <section class="contenido">

        <div class="informacion_cabecera">

            <div class="titulo_cabecera">
                <h2>Catálogo de Productos</h2>
                <p>Gestión general del portafolio comercial</p>
            </div>

            <div class="acciones">

                <div class="buscar_producto">
                    <i class="bi bi-search"></i>
                    <input
                        type="text"
                         placeholder="Buscar SKU o nombre...">
                </div>

                <button class="btn-add">
                    <i class="bi bi-plus-lg"></i>
                    Añadir Producto
                </button>

            </div>

        </div>

        <div class="card_contenido">

            <div class="icono_contenido">
                <i class="bi bi-box"></i>
            </div>

                <h3>Editor de Catálogo</h3>

                <p>
                    El CRUD maestro de productos está siendo implementado.<br>
                    Incluirá carga de imágenes múltiples, variantes y<br>
                    asignación de atributos Wabi-Sabi/Japandi.
                </p>

        </div>

    </section>

</main>

</div>

</body>
</html>
