<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenSpace</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="../Cliente/images/logo.png" alt="Logo ZenSpace" width="110" height="35">
        </div>
        <nav class="menu">
            <a href="index.html" class="link">Inicio</a>
            <a href="catalogo.html" class="link">Catalogo</a>
            <a href="visualizador.html" class="link">Visualizador 3D</a>
        </nav>
                <nav class="menu_1">
            <a href="carrito.html" class="btn-carrito"><i class="bi bi-basket"></i></a>
            <a href="login.html" class="btn-perfil"><i class="bi bi-person"></i></a>
        </nav>
    </header>

<section class="auth">

    <div class="auth-form">
        <h1>Crea tu cuenta</h1>
        <p>Únete para encontrar la armonía en tu hogar.</p>
        <form id="form-registro">
            <label>Nombre Completo</label>
            <div class="input-group">
                <i class="bi bi-person"></i>
                <input type="text" id="nombre" placeholder="Tu nombre">
            </div>
            <label>Correo Electrónico</label>
            <div class="input-group">
                <i class="bi bi-envelope"></i>
                <input type="email" id="correo" placeholder="ejemplo@correo.com">
            </div>
            <label>Contraseña</label>
            <div class="input-group">
                <i class="bi bi-lock"></i>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <label>Confirmar Contraseña</label>
            <div class="input-group">
                <i class="bi bi-lock"></i>
                <input type="password" id="confirmar-password" placeholder="••••••••">
            </div>
            <button class="btn-principal">
                Registrarme
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>
        <p class="registro">
            ¿Ya tienes una cuenta?
            <a href="login.html">Inicia sesión</a>
        </p>
    </div>

    <div class="auth-imagen">
        <div class="texto-imagen">
            <h2>Diseño Consciente</h2>
            <p>
                Mobiliario diseñado bajo los principios Wabi-Sabi,
                celebrando la belleza de la imperfección natural.
            </p>
        </div>
    </div>

</section>
</footer>
<script src="assets/js/app.js"></script>
</body>
</html>
