<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenSpace</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="index.html"><img src="images/logo.png" alt="Logo ZenSpace" width="110" height="35"></a>
        </div>
        <nav class="menu">
            <a href="index.html" class="link">Inicio</a>
            <a href="catalogo.html" class="link">Catalogo</a>
            <a href="visualizador.html" class="link">Visualizador 3D</a>
        </nav>
        <nav class="menu_1">
            <button type="button" class="btn-favoritos-nav" id="btn-favoritos-nav" title="Mis Favoritos">
                <i class="bi bi-heart"></i>
                <span class="badge-favoritos-contador" id="badge-fav-contador">0</span>
            </button>
            <a href="carrito.html" class="btn-carrito"><i class="bi bi-basket"></i></a>
            <a href="login.html" class="btn-perfil"><i class="bi bi-person"></i></a>
        </nav>
    </header>

<main id="app-contenido">
<section class="visualizador">

    <aside class="panel-3d">

      <div class="panel-titulo">
        <i class="bi bi-layers-half"></i>
          <div>
            <h2>Productos 3D</h2>
            <p id="subtitulo-piezas-3d">Cargando piezas...</p>
          </div>
      </div>

      <div class="lista-3d" id="lista-productos-3d">
        <!-- Renderizado dinámicamente con los productos añadidos -->
      </div>

      <div class="resumen-3d">
        <div class="total-productos3d">
            <span>Total del Look</span>
            <strong id="total-look-3d">$0.00</strong>
        </div>

        <button class="btn-look" id="btn-comprar-look">
            <i class="bi bi-cart3"></i>
            Comprar este look
        </button>

      </div>

    </aside>

    <div class="lienzo-3d" id="lienzo-3d-escena">
        <div class="visualizacion">
            <i class="bi bi-box"></i>
            <h3>Espacio en blanco</h3>
            <p>Agrega artículos desde el catálogo o desde el detalle de cada producto para componer tu look</p>
        </div>
    </div>

</section>
</main>

<footer class="footer">
    <p>&copy; 2026 ZenSpace. Todos los derechos reservados.</p>
</footer>

<script src="assets/js/app.js"></script>

</body>
</html>
