<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenSpace</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="index.html"><img src="images/logo.png" alt="Logo ZenSpace" width="110" height="35"></a>
        </div>
        <nav class="menu">
            <a href="index.html" class="link">Inicio</a>
            <a href="catalogo.html" class="link">Catalogo</a>
            <a href="visualizador.html" class="link">Visualizador 3D</a>
        </nav>
        <nav class="menu_1">
            <button type="button" class="btn-favoritos-nav" id="btn-favoritos-nav" title="Mis Favoritos">
                <i class="bi bi-heart"></i>
                <span class="badge-favoritos-contador" id="badge-fav-contador">0</span>
            </button>
            <a href="carrito.html" class="btn-carrito"><i class="bi bi-basket"></i></a>
            <a href="login.html" class="btn-perfil"><i class="bi bi-person"></i></a>
        </nav>
    </header>

<main id="app-contenido">
    <section class="catalogo">

        <div class="header-catalogo">

            <div>
                <h1>Catalogo ZenSpace</h1>
                <p>Descubre piezas Japandi diseñadas para crear armonía en tu hogar.</p>   
            </div>
            <div class="acciones">
                <div class="busqueda"><i class="bi bi-search"></i>
                <input type="text" id="buscador-catalogo" placeholder="Buscar productos">
                </div>

                <button class="btn-filtro"><i class="bi bi-sliders"></i>Filtros</button>

            </div>
        </div>

        <div class="filtros" id="filtros-categorias">
            <button class="chip activo" data-categoria="todos">Todos</button>
            <button class="chip" data-categoria="sala">Sala</button>
            <button class="chip" data-categoria="dormitorio">Dormitorio</button>
            <button class="chip" data-categoria="iluminacion">Iluminación</button>
            <button class="chip" data-categoria="decoracion">Decoración</button>
            <button class="chip" data-categoria="comedor">Comedor</button>
        </div>

        <div class="grid-catalogo" id="grid-productos-catalogo">
            <!-- Cargando productos desde MongoDB... -->
            <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #666;">
                <p><i class="bi bi-arrow-repeat" style="font-size: 24px; animation: spin 1s infinite linear;"></i></p>
                <p>Cargando piezas ZenSpace...</p>
            </div>
        </div>

        <div class="paginacion" id="paginacion-catalogo">
            <button class="pagina actual">1</button>
        </div>
    </section>
</main>

<footer class="footer">
    <p>&copy; 2026 ZenSpace. Todos los derechos reservados.</p>
</footer>

<script src="assets/js/app.js"></script>

</body>
</html>
