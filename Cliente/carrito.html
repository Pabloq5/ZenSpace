<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZenSpace</title>
<link rel="stylesheet" href="./assets/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<header class="header">
  <div class="logo">
      <img src="../Cliente/images/logo.png" alt="Logo ZenSpace" width="110" height="35">
  </div>
  <nav class="menu">
      <a href="index.html" class="link">Inicio</a>
      <a href="catalogo.html" class="link">Catalogo</a>
      <a href="visualizador.html" class="link">Visualizador 3D</a>
  </nav>
          <nav class="menu_1">
      <a href="carrito.html" class="btn-carrito"><i class="bi bi-basket"></i></a>
      <a href="login.html" class="btn-perfil"><i class="bi bi-person"></i></a>
  </nav>
</header>

<div class="header-carrito">
   <h3>Carrito de compras</h3>
</div>

<section class="carrito">

  <aside class="productos-carrito">

  </aside>

<div class="resumen-columna">

  <div class="resumen-carrito">
      <div class="resumen-pedido">
        <h3>Resumen del pedido</h3>

          <div class="fila-resumen">
            <span>Subtotal</span>
            <span></span>
          </div>

          <div class="fila-resumen">
            <span>Envío</span>
            <span></span>
          </div>

          <div class="fila-resumen">
            <span>Descuento</span>
            <span class="descuento"></span>
          </div>
      </div>

  <div class="finalizar-compra">

      <div class="fila-total">
        <h2>Total</h2>
        <span></span>
      </div>

        <p class="impuestos">Impuestos incluidos</p>

        <button class="btn-finalizar">
        <i class="bi bi-lock"></i> Finalizar compra
        </button>

        <button class="btn-envio">
        Calcular envío <i class="bi bi-truck"></i>
        </button>
      </div>
  </div>
  

  <div class="confianza-compra">

      <div class="fila-confianza">
        <i class="bi bi-shield-check"></i>

          <div class="texto-confianza">
            <h4>Pago seguro</h4>
            <p>Tus datos están protegidos</p>
          </div>
     </div>

      <div class="fila-confianza">
        <i class="bi bi-truck"></i>
          <div class="texto-confianza">
            <h4>Envío rápido</h4>
            <p>Recibe tu pedido en 3-5 días hábiles</p>
          </div>
      </div>

      <div class="fila-confianza">
       <i class="bi bi-headset"></i>
          <div class="texto-confianza">
            <h4>Atención al cliente</h4>
            <p>Estamos aquí para ayudarte</p>
          </div>
      </div>
  </div>
</div>
</section>

<script src="assets/js/app.js"></script>

</body>
</html>
